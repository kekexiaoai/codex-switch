name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test And Validate (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64 / macOS 14
            runner: macos-14
            arch: arm64
          - label: x86_64 / macOS 15 Intel
            runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Toolchain Versions
        run: |
          echo "Expected architecture: ${{ matrix.arch }}"
          uname -m
          rustc --version
          cargo --version
          node --version
          npm --version
          xcodebuild -version

      - name: Validate Workflow Runner Labels
        run: ./scripts/verify-github-workflow-runners.sh

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Frontend Tests
        working-directory: apps/rust-client/ui
        run: npm test

      - name: Frontend Build
        working-directory: apps/rust-client/ui
        run: npm run build

      - name: Rust Tests
        working-directory: apps/rust-client/src-tauri
        run: cargo test

      - name: Rust Build
        working-directory: apps/rust-client/src-tauri
        run: cargo build
