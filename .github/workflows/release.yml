name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release
        required: false
        default: main
      tag_name:
        description: Release tag name
        required: false
        default: ""
      prerelease:
        description: Mark the GitHub release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-arm64:
    name: Release arm64
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Release Metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
            if [[ -z "$TAG_NAME" ]]; then
              TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
            fi
          else
            TAG_NAME="$REF_NAME"
          fi

          echo "tag_name=$TAG_NAME" >>"$GITHUB_OUTPUT"
          echo "zip_name=Codex-Switch-${TAG_NAME}-arm64.zip" >>"$GITHUB_OUTPUT"

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Build App Bundle
        working-directory: apps/rust-client/ui
        run: npm run tauri build -- --bundles app

      - name: Inspect Binary Architecture
        run: |
          file "apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app/Contents/MacOS/codex-switch" | tee /tmp/codex-switch-app-arch.txt
          grep -q "arm64" /tmp/codex-switch-app-arch.txt

      - name: Create Release Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app" "dist/${{ steps.meta.outputs.zip_name }}"

      - name: Publish arm64 Asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.inputs.prerelease == 'true' }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.tag_name }} already exists"
          else
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "${{ steps.meta.outputs.tag_name }}" "dist/${{ steps.meta.outputs.zip_name }}" --target "${GITHUB_SHA}" --generate-notes --prerelease
              exit 0
            fi
            gh release create "${{ steps.meta.outputs.tag_name }}" "dist/${{ steps.meta.outputs.zip_name }}" --target "${GITHUB_SHA}" --generate-notes
            exit 0
          fi

          gh release upload "${{ steps.meta.outputs.tag_name }}" "dist/${{ steps.meta.outputs.zip_name }}" --clobber

  release-x86_64:
    name: Release x86_64
    runs-on: macos-15-intel
    needs: release-arm64
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Release Metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
            if [[ -z "$TAG_NAME" ]]; then
              TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
            fi
          else
            TAG_NAME="$REF_NAME"
          fi

          echo "tag_name=$TAG_NAME" >>"$GITHUB_OUTPUT"
          echo "zip_name=Codex-Switch-${TAG_NAME}-x86_64.zip" >>"$GITHUB_OUTPUT"

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Build App Bundle
        working-directory: apps/rust-client/ui
        run: npm run tauri build -- --bundles app

      - name: Inspect Binary Architecture
        run: |
          file "apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app/Contents/MacOS/codex-switch" | tee /tmp/codex-switch-app-arch.txt
          grep -q "x86_64" /tmp/codex-switch-app-arch.txt

      - name: Create Release Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app" "dist/${{ steps.meta.outputs.zip_name }}"

      - name: Upload x86_64 Asset To Existing Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.meta.outputs.tag_name }}" "dist/${{ steps.meta.outputs.zip_name }}" --clobber

  release-windows-x64:
    name: Release Windows x64
    runs-on: windows-2022
    needs: release-arm64
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
            if [[ -z "$TAG_NAME" ]]; then
              TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
            fi
          else
            TAG_NAME="$REF_NAME"
          fi

          echo "tag_name=$TAG_NAME" >>"$GITHUB_OUTPUT"

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Build NSIS Installer
        working-directory: apps/rust-client/ui
        run: npm run tauri build -- --bundles nsis

      - name: Collect Windows Installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find "apps/rust-client/src-tauri/target/release/bundle/nsis" -maxdepth 2 -type f -name "*.exe" -print -exec cp {} dist/ \;
          test "$(find dist -type f -name "*.exe" | wc -l)" -gt 0
          find dist -maxdepth 1 -type f -print

      - name: Upload Windows Asset To Existing Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.meta.outputs.tag_name }}" dist/*.exe --clobber

  release-linux-x64:
    name: Release Linux x64
    runs-on: ubuntu-22.04
    needs: release-arm64
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev

      - name: Resolve Release Metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
            if [[ -z "$TAG_NAME" ]]; then
              TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
            fi
          else
            TAG_NAME="$REF_NAME"
          fi

          echo "tag_name=$TAG_NAME" >>"$GITHUB_OUTPUT"

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Build Linux Bundles
        working-directory: apps/rust-client/ui
        run: npm run tauri build -- --bundles deb,appimage

      - name: Collect Linux Bundles
        run: |
          set -euo pipefail
          mkdir -p dist
          find "apps/rust-client/src-tauri/target/release/bundle/deb" -maxdepth 2 -type f -name "*.deb" -print -exec cp {} dist/ \;
          find "apps/rust-client/src-tauri/target/release/bundle/appimage" -maxdepth 2 -type f -name "*.AppImage" -print -exec cp {} dist/ \;
          test "$(find dist -type f | wc -l)" -gt 0
          find dist -maxdepth 1 -type f -print

      - name: Upload Linux Assets To Existing Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.meta.outputs.tag_name }}" dist/* --clobber
