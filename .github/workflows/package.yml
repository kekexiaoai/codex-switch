name: Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: main

concurrency:
  group: package-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Package Artifact (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64 / macOS 14
            runner: macos-14
            arch: arm64
          - label: x86_64 / macOS 15 Intel
            runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Build Tauri App Bundle
        working-directory: apps/rust-client/ui
        run: npm run tauri build -- --bundles app

      - name: Inspect Binary Architecture
        run: |
          file "apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app/Contents/MacOS/codex-switch" | tee /tmp/codex-switch-app-arch.txt
          grep -q "${{ matrix.arch }}" /tmp/codex-switch-app-arch.txt

      - name: Create Zip Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app" "dist/Codex-Switch-${{ matrix.arch }}-${{ github.run_number }}.zip"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Switch-app-${{ matrix.arch }}-${{ github.run_number }}
          path: apps/rust-client/src-tauri/target/release/bundle/macos/Codex Switch.app

      - name: Upload Zip Archive
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Switch-zip-${{ matrix.arch }}-${{ github.run_number }}
          path: dist/Codex-Switch-${{ matrix.arch }}-${{ github.run_number }}.zip
