name: Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Package Artifact (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: macos
            arch: arm64
            bundle_args: "--bundles dmg"
            artifact: codex-switch-macos-arm64
          - label: macOS x86_64
            runner: macos-15-intel
            platform: macos
            arch: x86_64
            bundle_args: "--bundles dmg"
            artifact: codex-switch-macos-x86_64
          - label: Windows x64
            runner: windows-2022
            platform: windows
            arch: x86_64
            bundle_args: "--bundles nsis"
            artifact: codex-switch-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rust-client/ui/package-lock.json

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Toolchain Versions
        shell: bash
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "Expected architecture: ${{ matrix.arch }}"
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Install Frontend Dependencies
        working-directory: apps/rust-client/ui
        run: npm ci

      - name: Build Tauri Bundle
        working-directory: apps/rust-client/ui
        run: npm run tauri build -- ${{ matrix.bundle_args }}

      - name: Inspect macOS Binary Architecture
        if: runner.os == 'macOS'
        run: |
          file "apps/rust-client/src-tauri/target/release/codex-switch" | tee /tmp/codex-switch-app-arch.txt
          grep -q "${{ matrix.arch }}" /tmp/codex-switch-app-arch.txt

      - name: Collect Bundle Outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle_dir="apps/rust-client/src-tauri/target/release/bundle"

          case "${{ matrix.platform }}" in
            macos)
              find "$bundle_dir/dmg" -maxdepth 2 -type f -name "*.dmg" -print -exec cp {} dist/ \;
              ;;
            windows)
              find "$bundle_dir/nsis" -maxdepth 2 -type f -name "*.exe" -print -exec cp {} dist/ \;
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

          test "$(find dist -type f | wc -l)" -gt 0
          find dist -maxdepth 1 -type f -print

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
